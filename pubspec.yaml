name: aolab_android
description: "Aolab — app móvil offline-first (formularios) que sincroniza con el backend Aolab."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Red / API
  dio: ^5.7.0

  # Persistencia local offline (SQLite)
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5

  # Token JWT en almacenamiento seguro
  flutter_secure_storage: ^9.2.2

  # Detección de conectividad para el sync
  connectivity_plus: ^6.1.0

  # Estado e identificadores
  provider: ^6.1.2
  uuid: ^4.5.1

  # Login con Google (nativo)
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/aolab-logo.webp

# Ícono de la app (AO sobre azul marino, con badge TEST). Se genera en CI con:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
