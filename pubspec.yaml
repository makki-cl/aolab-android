name: aolab_android
description: "Aolab — app móvil offline-first (formularios) que sincroniza con el backend Aolab."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Red / API
  dio: ^5.7.0

  # Persistencia local offline (SQLite)
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5

  # Token JWT en almacenamiento seguro
  flutter_secure_storage: ^9.2.2

  # Detección de conectividad para el sync
  connectivity_plus: ^6.1.0

  # Versión de la app (para la correlación de versión Web↔App)
  package_info_plus: ^8.0.0

  # Estado e identificadores
  provider: ^6.1.2
  uuid: ^4.5.1

  # Login con Google (nativo)
  google_sign_in: ^6.2.2

  # Cámara / galería para fotos de puntos de control (evidencias)
  image_picker: ^1.1.2

  # Audio: grabación con nivel/VU (validación de micrófono) + reproducción.
  # record 7.x: cierre de dependencias federadas consistente (record_linux 2.x);
  # 5.x fijaba record_linux a 0.7.x e incompatibilizaba con platform_interface nuevo.
  record: ^7.1.1
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

# Sin pubspec.lock commiteado, el CI resuelve dependencias frescas en cada build y una
# publicación nueva puede romperlo sin que cambie nuestro código. jni 1.0.1 (27-07-2026)
# exige un Gradle/Kotlin más nuevo y falla con "Could not find method kotlin()" al evaluar
# el proyecto :jni. Lo arrastra path_provider_android (jni: ^1.0.0); se fija en 1.0.0, la
# versión con la que el build venía verde.
dependency_overrides:
  jni: 1.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/aolab-logo.webp

# Ícono de la app (AO sobre azul marino, con badge TEST). Se genera en CI con:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
