name: Build Android APK

# Compila el APK en la nube y publica un Release con el instalable, para que
# Obtainium lo detecte e instale/actualice automáticamente.

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write # necesario para crear Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # El repo guarda solo lib/ + pubspec; aquí se generan las carpetas de plataforma.
      - name: Generar carpeta android
        run: flutter create --org cl.makki --project-name aolab_android --platforms=android .

      - name: Dependencias
        run: flutter pub get

      - name: Compilar APK (release)
        run: flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      # Firmamos con la llave de release (misma siempre) para que Obtainium/Android
      # puedan ACTUALIZAR la app entre versiones.
      - name: Firmar APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > release.jks
          BUILD_TOOLS="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" sign \
            --ks release.jks --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASS" \
            --out "aolab-${{ github.run_number }}.apk" \
            build/app/outputs/flutter-apk/app-release.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs "aolab-${{ github.run_number }}.apk"
          rm -f release.jks

      - name: Publicar Release (Obtainium lo lee de aquí)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Aolab v1.0.${{ github.run_number }}
          files: aolab-${{ github.run_number }}.apk
          generate_release_notes: true
