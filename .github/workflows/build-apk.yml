name: Build Android APK

# Compila el APK en la nube y publica un Release con el instalable, para que
# Obtainium lo detecte e instale/actualice automáticamente.

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write # necesario para crear Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # El repo guarda solo lib/ + pubspec; aquí se generan las carpetas de plataforma.
      - name: Generar carpeta android
        run: flutter create --org cl.makki --project-name aolab_android --platforms=android .

      - name: Dependencias
        run: flutter pub get

      - name: Ícono de la app (AO + badge TEST)
        run: dart run flutter_launcher_icons

      # Canal TEST: applicationId propio (convive con prod), nombre y servidor de test.
      # Tolera tanto Kotlin DSL (build.gradle.kts) como Groovy (build.gradle).
      - name: Config canal TEST
        run: |
          sed -i -E 's/applicationId = "[^"]+"/applicationId = "cl.makki.aolab.test"/' android/app/build.gradle.kts 2>/dev/null || true
          sed -i -E 's/applicationId "[^"]+"/applicationId "cl.makki.aolab.test"/' android/app/build.gradle 2>/dev/null || true
          sed -i -E 's/android:label="[^"]+"/android:label="Aolab Test"/' android/app/src/main/AndroidManifest.xml || true
          # Permiso de micrófono para grabar audios de evidencia (además del que aporta el plugin record).
          grep -q RECORD_AUDIO android/app/src/main/AndroidManifest.xml || \
            sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          echo "== applicationId =="; grep -R "applicationId" android/app/build.gradle* || true

      - name: Compilar APK (release, apunta a dev.aolab.cl)
        run: flutter build apk --release --dart-define=AOLAB_API_BASE_URL=https://dev.aolab.cl --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      # Firmamos con la llave de release (misma siempre) para que Obtainium/Android
      # puedan ACTUALIZAR la app entre versiones.
      - name: Firmar APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > release.jks
          BUILD_TOOLS="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" sign \
            --ks release.jks --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASS" \
            --out "aolab-test-${{ github.run_number }}.apk" \
            build/app/outputs/flutter-apk/app-release.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs "aolab-test-${{ github.run_number }}.apk"
          rm -f release.jks

      - name: Publicar Release (Obtainium lo lee de aquí)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Aolab Test v1.0.${{ github.run_number }}
          files: aolab-test-${{ github.run_number }}.apk
          generate_release_notes: true
