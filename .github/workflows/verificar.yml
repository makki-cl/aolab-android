name: Verificar código (analyze + pruebas)

# Revisa el código y comprueba que compila (un APK de depuración que no se firma, no se guarda ni se publica). Corre en
# las ramas de trabajo (las ramas que publican —dev, prod— tienen su propio flujo).
on:
  push:
    branches-ignore: [dev, prod, staging, test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La misma versión fija que build-apk.yml.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Dependencias (las del pubspec.lock)
        run: flutter pub get --enforce-lockfile

      - name: Analizar código
        run: flutter analyze --no-fatal-infos

      - name: Pruebas
        run: flutter test

  # Que la carpeta android que genera «flutter create», con tool/configurar_android.sh, compile con los plugins del lock
  # (AppAuth necesita su appAuthRedirectScheme). Es lo mismo que hacen build-apk.yml y build-prod.yml, sin firmar ni
  # publicar: si esto falla, fallaría el build de producción.
  compilar:
    runs-on: ubuntu-latest
    needs: verificar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Generar carpeta android
        run: |
          flutter create --org cl.makki --project-name aolab_android --platforms=android .
          rm -f test/widget_test.dart
          git checkout -- pubspec.yaml pubspec.lock
          flutter pub get --enforce-lockfile

      - name: Config de producción (paquete, permisos, retorno de Microsoft)
        run: bash tool/configurar_android.sh cl.makki.aolab "Aolab"

      - name: Compilar APK de depuración (sin firmar ni publicar)
        run: flutter build apk --debug --dart-define=AOLAB_API_BASE_URL=https://ejemplo.invalid
